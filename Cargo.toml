[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
hl-types = { path = "crates/hl-types" }
hl-rules = { path = "crates/hl-rules" }
hl-strategy = { path = "crates/hl-strategy" }
hl-gateway = { path = "crates/hl-gateway" }
hl-sim = { path = "crates/hl-sim" }
hl-ledger = { path = "crates/hl-ledger" }
hl-codec = { path = "crates/hl-codec" }
hl-book = { path = "crates/hl-book" }
hl-run = { path = "crates/hl-run" }
hl-recorder = { path = "crates/hl-recorder" }

clickhouse = { version = "0.15.3", default-features = false, features = ["lz4"] }
data-encoding = "2.11.1"
miniz_oxide = "0.9.1"
lz4_flex = { version = "0.14.2", default-features = false, features = ["frame", "std"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
sha2 = "0.11.1"
signal-hook = { version = "0.4.6", default-features = false }
tokio = { version = "1.54.1", features = ["rt", "macros"] }
toml = "1.2.2"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
zstd = "0.14.4"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

# Fixed-point arithmetic must never wrap silently, in any profile.
[profile.release]
overflow-checks = true
