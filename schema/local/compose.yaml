# Local ClickHouse for the schema and loader.
# Nothing in the repository starts this automatically.
services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    container_name: hlmm-clickhouse
    restart: unless-stopped
    ports:
      # HTTP and native protocol, reachable from this machine only.
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_USER: hlmm
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in the env file}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ${CLICKHOUSE_DATA_DIR:-./data}:/var/lib/clickhouse
      - ${CLICKHOUSE_LOG_DIR:-./logs}:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
